
# ==========================================================
# PROYECTO: APLICACIÓN DE GESTIÓN DE PELUQUERÍA
# Servicios: Frontend + API + Base de datos
# ==========================================================

services:

  # ========================================================
  # SERVICIO 1: BASE DE DATOS (MariaDB)
  # ========================================================

  database:

    # Imagen oficial de MariaDB
    image: mariadb:11.4

    # Nombre fijo del contenedor
    container_name: peluqueria-db

    # Reiniciar automáticamente salvo parada manual
    restart: unless-stopped

    # Puerto de conexión desde el equipo anfitrión.
    # Permite utilizar herramientas como DBeaver.
    # Solo acepta conexiones desde el propio equipo.
    ports:
      - "127.0.0.1:3306:3306"

    # Variables de configuración de MariaDB
    environment:

      # Base de datos que se creará al inicializar el volumen
      MARIADB_DATABASE: ${DB_NAME:-peluqueria}

      # Usuario de la aplicación
      MARIADB_USER: ${DB_USER:-peluqueria_app}

      # Contraseña del usuario de la aplicación
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

      # Contraseña del administrador de MariaDB
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}

      # Zona horaria
      TZ: ${TZ:-Europe/Madrid}

    # Volúmenes para conservar los datos y cargar los scripts SQL
    volumes:

      # Persistencia de la base de datos
      - mariadb_data:/var/lib/mysql

      # Script de creación de tablas
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

      # Script de inserción de datos iniciales
      - ./database/default_data.sql:/docker-entrypoint-initdb.d/002-data.sql:ro

    # Conexión a la red interna
    networks:
      - backend

    # Comprobación de disponibilidad de MariaDB
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ========================================================
  # SERVICIO 2: API (PHP 8.4 + Apache)
  # ========================================================

  api:

    # Construir la imagen utilizando nuestro Dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile

    # Nombre fijo del contenedor
    container_name: peluqueria-api

    # Reinicio automático
    restart: unless-stopped

    # Variables de entorno de la API
    environment:

      # Entorno de ejecución
      APP_ENV: ${APP_ENV:-development}

      # Zona horaria de PHP
      APP_TIMEZONE: ${TZ:-Europe/Madrid}

      # Configuración de conexión con MariaDB
      # "database" es el nombre del servicio dentro de Docker.
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-peluqueria}
      DB_USER: ${DB_USER:-peluqueria_app}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

    # Puerto de acceso a la API desde el equipo anfitrión
    # Puerto local 8081 -> Puerto 80 del contenedor
    ports:
      - "127.0.0.1:${API_PORT:-8081}:80"

    # Sincronizar el código PHP local con el contenedor
    volumes:
      - ./backend:/var/www/html

    # Esperar a que MariaDB esté disponible antes de iniciar
    depends_on:
      database:
        condition: service_healthy

    # Red interna
    networks:
      - backend

    # Comprobar que Apache está escuchando
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"
        ]
      interval: 15s
      timeout: 5s
      retries: 5


  # ========================================================
  # SERVICIO 3: FRONTEND (Apache)
  # ========================================================

  frontend:

    # Imagen oficial de PHP con Apache.
    # En este contenedor PHP no se utiliza como backend:
    # Apache se limita a servir HTML, CSS y JavaScript.
    image: php:8.4-apache

    # Nombre fijo del contenedor
    container_name: peluqueria-frontend

    # Reinicio automático
    restart: unless-stopped

    # Puerto de acceso al frontend
    # Puerto local 8080 -> Puerto 80 del contenedor
    ports:
      - "127.0.0.1:${GUI_PORT:-8080}:80"

    # Montar la carpeta del frontend en el directorio
    # público por defecto de Apache.
    volumes:
      - ./frontend:/var/www/html

    # Red interna
    networks:
      - backend

    # Comprobar que Apache está escuchando
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"
        ]
      interval: 15s
      timeout: 5s
      retries: 5


# ==========================================================
# VOLÚMENES PERSISTENTES
# ==========================================================

volumes:

  # Almacena los datos de MariaDB.
  # Los datos permanecen aunque se eliminen los contenedores.
  mariadb_data:


# ==========================================================
# REDES
# ==========================================================

networks:

  # Red privada para la comunicación entre contenedores.
  # El frontend no necesita acceder directamente a MariaDB.
  backend:
    driver: bridge
